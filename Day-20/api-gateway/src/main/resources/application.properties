spring.application.name=api-gateway
server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=user-management-service
spring.cloud.gateway.routes[1].uri=lb://USER-MANAGEMENT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[2].id=notes-service
spring.cloud.gateway.routes[2].uri=lb://NOTES-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/notes/**

spring.cloud.gateway.routes[3].id=reminder-service
spring.cloud.gateway.routes[3].uri=lb://REMINDER-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/reminders/**

spring.cloud.gateway.routes[4].id=export-service
spring.cloud.gateway.routes[4].uri=lb://EXPORT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/exports/**