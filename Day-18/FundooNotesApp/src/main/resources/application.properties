spring.application.name=FundooNotesApp

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/fundoo_notes_db
spring.datasource.username=root
spring.datasource.password=Abhishek@2003

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JMS - Artemis embedded broker
spring.artemis.mode=embedded

# Debug logs for our app
logging.level.com.fundoonotes=DEBUG

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true



