<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Home - My Greetings App</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="container">

    <h1>My Greetings App</h1>

    <h2>
        Welcome, <span th:text="${name}"></span>!
    </h2>

    <p>You have successfully logged in.</p>

    <hr>

    <h3>Account Details</h3>

    <div class="account-details">

        <p>
            Name:
            <strong th:text="${name}"></strong>
        </p>

        <p>
            Email:
            <strong th:text="${email}"></strong>
        </p>

        <p>
            Username:
            <strong th:text="${username}"></strong>
        </p>

    </div>

    <hr>

    <!-- Edit Username Button -->
    <button type="button" onclick="showEditUsername()">
        Edit Username
    </button>

    <!-- Update Username Form -->
    <div id="editUsername" style="display:none; margin-top:15px;">

        <form action="/update-username" method="post">

            <label for="username">New Username:</label>

            <input type="text"
                   id="username"
                   name="username"
                   th:value="${username}"
                   required>

            <button type="submit">
                Update Username
            </button>

        </form>

    </div>

    <br><br>

    <!-- Delete Account -->
    <form action="/delete-account"
          method="post"
          onsubmit="return confirm('Are you sure you want to delete your account?');">

        <button type="submit">
            Delete Account
        </button>

    </form>

    <br>

    <!-- Logout -->
    <a href="/logout">
        Logout
    </a>

</div>


<script>
    function showEditUsername() {
        document.getElementById("editUsername").style.display = "block";
    }
</script>

</body>

</html>
